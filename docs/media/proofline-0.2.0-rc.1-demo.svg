<text x="535" y="443" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400" fill="#AAB39F">→</text>
<text x="1042" y="443" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400" fill="#AAB39F">→</text>
<text x="65" y="670" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#F2F0DF">Query gaps. Recheck the affected line. Keep the matching evidence.</text>
<text x="66" y="721" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#AAB39F">Synthetic CLI demo with explicit dependencies. Verified means current under the configured checks.</text>
<rect x="64" y="786" width="1472" height="1" rx="0" fill="#43503B"/>
<text x="66" y="817" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F2F0DF">Intake review file  →  Proofline evidence  →  Workprint export</text>
<text x="1232" y="823" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#D4FF58">OPEN SOURCE / LOCAL</text>
