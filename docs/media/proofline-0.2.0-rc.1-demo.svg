<text x="1379" y="492" dominant-baseline="text-before-edge" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#D4FF58">verified</text>
<text x="90" y="557" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#F2F0DF">Note capture</text>
<text x="365" y="558" dominant-baseline="text-before-edge" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#D4FF58">verified</text>
<text x="597" y="557" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#F2F0DF">Note capture</text>
